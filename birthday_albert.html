<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>너의 내일을 기대해</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            background-color: #f0f0f0;
            text-align: center;
            position: relative;
        }
        .content {
            transform: translateY(-100px);
        }
        h1 {
            font-size: 2rem;
            color: #333;
            margin: 10px 0;
        }
        h2 {
            font-size: 1.2rem;
            color: #666;
            margin: 5px 0;
        }
        #badge {
            position: absolute;
            top: 20px;
            right: 20px;
        }
    </style>
</head>
<body>
    <img id="badge" src="https://api.visitorbadge.io/api/visitors?path=https%3A%2F%2Fjihan-e.github.io%2Fmachasal%2Fbirthday_albert.html&countColor=%2379C83D" alt="Hits">

    <div class="content">
        <h2 id="current-date"></h2>
        <h1>알버트 생일 축하해!</h1>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        const dateElement = document.getElementById('current-date');
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth() + 1;
        const date = now.getDate();
        
        dateElement.textContent = `${year}년 ${month}월 ${date}일`;

        window.onload = () => {
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 }
            });
        };
    </script>
</body>
</html>
